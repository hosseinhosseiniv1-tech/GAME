# Force Nixpacks to build python env properly
# Key fix: use python -m pip instead of bare pip

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip setuptools wheel",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "python game.py"